<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunfleck Web</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 32px auto; padding: 0 20px; max-width: 860px; background: #f7f6f2; color: #24221f; font: 16px system-ui; }
  canvas { display: block; width: 100%; height: 580px; border: 1px solid #d5cfc2; border-radius: 8px; touch-action: none; }
  canvas:focus-visible { outline: 2px solid #885000; outline-offset: 3px; }
  #file-drop-target { margin: 0 0 12px; padding: 12px 16px; border: 2px dashed #986a32; border-radius: 8px; background: #faf0df; }
  #file-drop-status:not(:empty) { display: block; margin-top: 4px; overflow-wrap: anywhere; }
  #status { min-height: 1.5em; }
</style>
<h1>Sunfleck Web</h1>
<p>Use the buttons below. The delayed action keeps the interface responsive.</p>
<p>Try typing, selecting, pasting, and using your input method in the text fields.</p>
<section id="file-drop-target" aria-labelledby="file-drop-label">
  <strong id="file-drop-label">Drop a file from File Explorer here</strong>
  <output id="file-drop-status" aria-live="polite"></output>
</section>
<canvas id="surface" tabindex="0" aria-label="Sunfleck application"></canvas>
<p id="status" role="status">Loading…</p>
<button id="stop" type="button">Close application</button>
<script type="module" src="./main.js"></script>
</html>
