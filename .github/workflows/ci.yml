name: Build
on: [pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
        preset: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: cmake --preset ${{ matrix.preset }}
        if: runner.os == 'Windows'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxtst6 xvfb xauth libegl-dev libgles-dev libegl-mesa0 libfreetype-dev fonts-dejavu-core fonts-noto-cjk
          cmake --preset ${{ matrix.preset }} -DUI_ENABLE_GLES3=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - if: runner.os == 'Windows'
        run: ctest --preset ${{ matrix.preset }} -LE interactive
      - if: runner.os == 'Linux'
        run: ctest --preset ${{ matrix.preset }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
